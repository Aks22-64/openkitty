name: Daily App Store Ingestion ($0 Cron)

on:
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: read

jobs:
  sync-data:
    if: vars.ENABLE_DATA_SYNC == 'true'
    timeout-minutes: 10
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run Free Store Ingestion Pipeline
        run: |
          python scripts/ingest.py

      - name: Commit & Push Updated Store Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/apps.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-sync daily app store rankings and metrics [skip ci]" && git push)
